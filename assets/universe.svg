<svg width="1000" height="560" viewBox="0 0 1000 560"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <radialGradient id="space" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#15152B"/>
      <stop offset="45%" stop-color="#0B0B18"/>
      <stop offset="100%" stop-color="#050509"/>
    </radialGradient>

    <!-- Central glow -->
    <radialGradient id="core">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#E9D5FF"/>
      <stop offset="35%" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Node gradients -->
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="build" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="creative" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="writing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

  </defs>


  <!-- ================================= -->
  <!-- SPACE -->
  <!-- ================================= -->

  <rect width="1000" height="560" rx="30" fill="url(#space)"/>


  <!-- ================================= -->
  <!-- STARS -->
  <!-- ================================= -->

  <g fill="#FFFFFF">

    <circle cx="80" cy="80" r="1.5"/>
    <circle cx="150" cy="180" r="1"/>
    <circle cx="230" cy="65" r="1.5"/>
    <circle cx="310" cy="120" r="1"/>
    <circle cx="410" cy="45" r="1"/>
    <circle cx="590" cy="75" r="1.5"/>
    <circle cx="700" cy="45" r="1"/>
    <circle cx="820" cy="100" r="1.5"/>
    <circle cx="910" cy="65" r="1"/>
    <circle cx="950" cy="230" r="1.5"/>

    <circle cx="55" cy="350" r="1"/>
    <circle cx="120" cy="460" r="1.5"/>
    <circle cx="230" cy="400" r="1"/>
    <circle cx="760" cy="440" r="1"/>
    <circle cx="850" cy="380" r="1.5"/>
    <circle cx="940" cy="470" r="1"/>

  </g>


  <!-- Twinkling stars -->

  <g fill="#C4B5FD">

    <circle cx="190" cy="110" r="2">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="810" cy="180" r="2">
      <animate
        attributeName="opacity"
        values="1;0.2;1"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="320" cy="470" r="2">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================= -->
  <!-- ORBITS -->
  <!-- ================================= -->

  <ellipse
      cx="500"
      cy="280"
      rx="340"
      ry="145"
      fill="none"
      stroke="#A78BFA"
      stroke-opacity="0.12"
      stroke-width="1"/>

  <ellipse
      cx="500"
      cy="280"
      rx="245"
      ry="105"
      fill="none"
      stroke="#60A5FA"
      stroke-opacity="0.10"
      stroke-width="1"/>


  <!-- ================================= -->
  <!-- CENTRAL GLOW -->
  <!-- ================================= -->

  <circle
      cx="500"
      cy="280"
      r="110"
      fill="url(#core)"
      opacity="0.45"
      filter="url(#softGlow)"/>


  <!-- ================================= -->
  <!-- CENTRAL STAR -->
  <!-- ================================= -->

  <circle
      cx="500"
      cy="280"
      r="42"
      fill="url(#core)"
      filter="url(#glow)">

    <animate
      attributeName="r"
      values="42;47;42"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Central text -->

  <text
      x="500"
      y="274"
      text-anchor="middle"
      fill="#FFFFFF"
      font-size="25"
      font-weight="700"
      font-family="Arial, Helvetica, sans-serif">

      ARPITA

  </text>

  <text
      x="500"
      y="298"
      text-anchor="middle"
      fill="#C4B5FD"
      font-size="12"
      font-family="monospace">

    

  </text>


  <!-- ================================= -->
  <!-- AI NODE -->
  <!-- ================================= -->

  <g>

    <circle
        cx="500"
        cy="90"
        r="58"
        fill="#0F0B1F"
        stroke="url(#ai)"
        stroke-width="2"/>

    <circle
        cx="500"
        cy="90"
        r="48"
        fill="#7C3AED"
        opacity="0.08"/>

    <text
        x="500"
        y="88"
        text-anchor="middle"
        fill="#DDD6FE"
        font-size="22">

        ✦

    </text>

    <text
        x="500"
        y="112"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="14"
        font-family="monospace">

        PRODUCTS

    </text>

    <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -7;0 0"
        dur="5s"
        repeatCount="indefinite"/>

  </g>


  <!-- ================================= -->
  <!-- BUILDS NODE -->
  <!-- ================================= -->

  <g>

    <circle
        cx="820"
        cy="280"
        r="65"
        fill="#07121D"
        stroke="url(#build)"
        stroke-width="2"/>

    <text
        x="820"
        y="275"
        text-anchor="middle"
        fill="#67E8F9"
        font-size="22">

        ◇

    </text>

    <text
        x="820"
        y="300"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="14"
        font-family="monospace">

        ARTIFICIAL INTELLIGENCE

    </text>

    <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;7 0;0 0"
        dur="6s"
        repeatCount="indefinite"/>

  </g>


  <!-- ================================= -->
  <!-- CREATIVE NODE -->
  <!-- ================================= -->

  <g>

    <circle
        cx="500"
        cy="470"
        r="65"
        fill="#1A0915"
        stroke="url(#creative)"
        stroke-width="2"/>

    <text
        x="500"
        y="465"
        text-anchor="middle"
        fill="#F9A8D4"
        font-size="22">

        ✧

    </text>

    <text
        x="500"
        y="490"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="14"
        font-family="monospace">

        ENGINEERING

    </text>

    <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 7;0 0"
        dur="5.5s"
        repeatCount="indefinite"/>

  </g>


  <!-- ================================= -->
  <!-- WRITING NODE -->
  <!-- ================================= -->

  <g>

    <circle
        cx="180"
        cy="280"
        r="65"
        fill="#191205"
        stroke="url(#writing)"
        stroke-width="2"/>

    <text
        x="180"
        y="275"
        text-anchor="middle"
        fill="#FDE68A"
        font-size="22">

        ∿

    </text>

    <text
        x="180"
        y="300"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="14"
        font-family="monospace">

        WRITING

    </text>

    <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-7 0;0 0"
        dur="6.5s"
        repeatCount="indefinite"/>

  </g>


  <!-- ================================= -->
  <!-- CONNECTIONS -->
  <!-- ================================= -->

  <g
      stroke="#A78BFA"
      stroke-opacity="0.22"
      stroke-width="1">

    <line x1="500" y1="132" x2="500" y2="238"/>

    <line x1="565" y1="280" x2="755" y2="280"/>

    <line x1="500" y1="322" x2="500" y2="405"/>

    <line x1="435" y1="280" x2="245" y2="280"/>

  </g>





  <!-- ================================= -->
  <!-- FLOATING PARTICLE -->
  <!-- ================================= -->

  <circle
      cx="330"
      cy="200"
      r="3"
      fill="#67E8F9"
      filter="url(#glow)">

    <animateMotion
        path="M 0 0 C 100 -80 180 100 300 0"
        dur="8s"
        repeatCount="indefinite"/>

  </circle>

</svg>