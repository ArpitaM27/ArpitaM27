<svg width="900" height="280" viewBox="0 0 900 280"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#171B2E"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Moving glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#9B8CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9B8CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft text glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Background -->

  <rect width="900" height="280" rx="24" fill="url(#bg)"/>


  <!-- Ambient glow -->

  <circle cx="150" cy="80" r="150" fill="url(#glow)">
    <animate
      attributeName="cx"
      values="150;250;150"
      dur="8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="760" cy="210" r="180" fill="url(#glow)">
    <animate
      attributeName="cy"
      values="210;150;210"
      dur="10s"
      repeatCount="indefinite"/>
  </circle>


  <!-- Floating stars -->

  <g fill="#FFFFFF">

    <circle cx="90" cy="45" r="2">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="220" cy="190" r="2">
      <animate
        attributeName="opacity"
        values="1;0.2;1"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="55" r="2">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="820" cy="160" r="2">
      <animate
        attributeName="opacity"
        values="1;0.2;1"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="580" cy="35" r="1.5">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.2s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- Decorative orbit -->

  <ellipse
    cx="450"
    cy="140"
    rx="300"
    ry="95"
    fill="none"
    stroke="#9B8CFF"
    stroke-opacity="0.12"
    stroke-width="1">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 450 140"
      to="360 450 140"
      dur="20s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- Small floating symbols -->

  <text x="105" y="225"
        fill="#9B8CFF"
        font-size="22"
        font-family="monospace">

    &lt;/&gt;

    <animate
      attributeName="y"
      values="225;215;225"
      dur="4s"
      repeatCount="indefinite"/>

  </text>


  <text x="760" y="105"
        fill="#58A6FF"
        font-size="20"
        font-family="monospace">

    { }

    <animate
      attributeName="y"
      values="105;95;105"
      dur="3.5s"
      repeatCount="indefinite"/>

  </text>


  <!-- Main title -->

  <text
    x="450"
    y="125"
    text-anchor="middle"
    fill="#FFFFFF"
    font-size="52"
    font-weight="700"
    font-family="Arial, Helvetica, sans-serif"
    filter="url(#textGlow)">

    ARPITA

  </text>


  <!-- Subtitle -->

  <text
    x="450"
    y="165"
    text-anchor="middle"
    fill="#9B8CFF"
    font-size="18"
    font-family="monospace">

    BUILD • CREATE • EXPLORE

  </text>


  <!-- Animated cursor -->

  <rect
    x="635"
    y="147"
    width="10"
    height="22"
    fill="#9B8CFF">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Bottom line -->

  <line
    x1="250"
    y1="210"
    x2="650"
    y2="210"
    stroke="#9B8CFF"
    stroke-opacity="0.3">

    <animate
      attributeName="x1"
      values="250;300;250"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x2"
      values="650;600;650"
      dur="5s"
      repeatCount="indefinite"/>

  </line>


  <!-- Tiny footer -->

  <text
    x="450"
    y="245"
    text-anchor="middle"
    fill="#8B949E"
    font-size="13"
    font-family="monospace">

    Computer Science • AI • Products • Creativity

  </text>

</svg>