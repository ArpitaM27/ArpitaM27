name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-snake.svg?color_snake=#a78bfa&color_dots=#161b22,#312e81,#4c1d95,#7c3aed,#c4b5fd
            assets/github-contribution-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#312e81,#4c1d95,#7c3aed,#c4b5fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "🐍 Update contribution snake"
          add: "assets/github-contribution-snake.svg assets/github-contribution-snake-dark.svg"