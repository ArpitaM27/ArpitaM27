name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ARPITA27
          outputs: |
            assets/github-contribution-snake.svg
            assets/github-contribution-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#312e81,#4c1d95,#7c3aed,#c4b5fd

      - name: Push Snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "🐍 Update contribution snake"
          add: "assets/github-contribution-snake.svg assets/github-contribution-snake-dark.svg"